<div class="p-8 max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold text-white mb-6">Your Boards</h1>

  @if (loading()) {
    <div class="flex justify-center py-12">
      <i class="pi pi-spin pi-spinner text-2xl text-surface-400"></i>
    </div>
  } @else {
    <div class="flex flex-col gap-2">

      @for (board of boards(); track board.id) {
        <div
          (click)="openBoard(board)"
          class="flex justify-between items-center bg-surface-900 hover:bg-surface-800 rounded-lg px-4 py-3 cursor-pointer text-white transition-colors"
        >
          <span class="font-medium">{{ board.name }}</span>
          <span class="text-surface-400 text-sm">
            {{ board.listCount }} {{ board.listCount === 1 ? 'list' : 'lists' }}
          </span>
        </div>
      } @empty {
        <p class="text-surface-400 text-sm">No boards yet — create your first one below.</p>
      }

      @if (addingNew()) {
        <div class="bg-surface-900 rounded-lg p-3 flex flex-col gap-2">
          <input
            pInputText
            [(ngModel)]="newBoardName"
            (keydown.enter)="submitNewBoard()"
            (keydown.escape)="cancelAdding()"
            placeholder="Board name..."
            class="w-full bg-surface-800 text-white text-sm rounded p-2 border-none focus:outline-none"
            autofocus
          />
          <div class="flex gap-2">
            <p-button label="Create" size="small" [loading]="saving()" (onClick)="submitNewBoard()" />
            <button (click)="cancelAdding()" class="bg-transparent border-none text-surface-400 hover:text-white cursor-pointer">
              <i class="pi pi-times"></i>
            </button>
          </div>
        </div>
      } @else {
        <button
          (click)="startAdding()"
          class="text-left text-surface-400 hover:text-white hover:bg-surface-900 rounded-lg px-4 py-3 text-sm bg-transparent border-none cursor-pointer"
        >
          + New board
        </button>
      }

    </div>
  }
</div>

<div class="fixed inset-0 bg-black/60 flex justify-center items-center p-6" (click)="close()">
  <div
    class="w-full max-w-lg bg-surface-900 text-white rounded-xl shadow-lg p-6"
    (click)="$event.stopPropagation()"
  >
    @if (loading()) {
      <div class="flex justify-center py-8">
        <i class="pi pi-spin pi-spinner text-2xl text-surface-400"></i>
      </div>
    } @else {
      <div class="flex justify-between items-start mb-6">
        <h2 class="text-xl font-semibold m-0">Edit Ticket</h2>
        <button (click)="close()" class="bg-transparent border-none text-surface-400 hover:text-white cursor-pointer">
          <i class="pi pi-times"></i>
        </button>
      </div>

      <app-field-list [model]="model" [fields]="fields" class="mb-6" />

      <div class="flex justify-between items-center pt-4 border-t border-surface-700">
        <button
          (click)="delete()"
          class="text-red-400 hover:text-red-300 bg-transparent border-none cursor-pointer text-sm"
        >
          Delete ticket
        </button>
        <div class="flex gap-3">
          <p-button label="Cancel" severity="secondary" (onClick)="close()" />
          <p-button label="Save" [loading]="saving()" (onClick)="save()" />
        </div>
      </div>
    }
  </div>
</div>

<div class="flex justify-content-center align-items-center min-h-screen p-3">
  <p-card [header]="config.title" [subheader]="config.subtitle" [style]="{ width: '100%', maxWidth: '400px' }">

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" class="w-full mb-3 block" />
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
      <app-field-list [model]="model" [fields]="config.fields"></app-field-list>

      <p-button type="submit" [label]="config.submitLabel" [loading]="isLoading()" styleClass="w-full mt-2" />
    </form>

    <ng-template pTemplate="footer">
      <p class="text-center text-sm m-0">
        {{ config.footerText }}
        <a [routerLink]="config.footerRoute" class="text-primary font-bold no-underline">{{ config.footerLinkText }}</a>
      </p>
    </ng-template>
  </p-card>
</div>

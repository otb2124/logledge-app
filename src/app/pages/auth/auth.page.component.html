<div class="flex justify-center items-center min-h-screen p-8">
  <div class="w-full max-w-2xl flex flex-col bg-neutral-900 text-white rounded-xl shadow-lg p-8">

    <div class="mb-6">
      <h2 class="text-2xl font-semibold m-0">{{ config.title }}</h2>
      <p class="text-surface-400 mt-2 mb-0">{{ config.subtitle }}</p>
    </div>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" class="w-full mb-6 block" />
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <app-field-list [model]="model" [fields]="config.fields"></app-field-list>

      <p-button type="submit" [label]="config.submitLabel" [loading]="isLoading()" styleClass="w-full mt-4" />
    </form>

    <p class="text-center text-sm mt-6 mb-0">
      {{ config.footerText }}
      <a [routerLink]="config.footerRoute" class="text-primary font-bold no-underline">{{ config.footerLinkText }}</a>
    </p>

  </div>
</div>

<div class="flex justify-content-center align-items-center min-h-screen p-3">
  <p-card header="Welcome Back" subheader="Sign in to your account" [style]="{ width: '100%', maxWidth: '400px' }">

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" class="w-full mb-3 block" />
    }

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
      <div class="flex flex-column gap-2">
        <label for="email" class="font-semibold">Email</label>
        <input
          pInputText
          id="email"
          type="email"
          formControlName="email"
          placeholder="user@example.com"
          class="w-full"
        />
        @if (loginForm.controls.email.touched && loginForm.controls.email.invalid) {
          <small class="p-error">Valid email is required.</small>
        }
      </div>

      <div class="flex flex-column gap-2">
        <label for="password" class="font-semibold">Password</label>
        <p-password
          id="password"
          formControlName="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full"
        />
        @if (loginForm.controls.password.touched && loginForm.controls.password.invalid) {
          <small class="p-error">Password is required.</small>
        }
      </div>

      <p-button
        type="submit"
        label="Sign In"
        [loading]="isLoading()"
        [disabled]="loginForm.invalid"
        styleClass="w-full mt-2"
      />
    </form>

    <ng-template pTemplate="footer">
      <p class="text-center text-sm m-0">
        Don't have an account? <a routerLink="/signup" class="text-primary font-bold no-underline">Sign up</a>
      </p>
    </ng-template>
  </p-card>
</div>

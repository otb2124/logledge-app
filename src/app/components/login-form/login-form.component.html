<div class="flex justify-content-center align-items-center min-h-screen p-3">
  <p-card header="Welcome Back" subheader="Sign in to your account" [style]="{ width: '100%', maxWidth: '400px' }">

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()!" class="w-full mb-3 block" />
    }

    <form (ngSubmit)="onSubmit()" class="flex flex-column gap-3">
      <app-field-list [model]="model" [fields]="fields"></app-field-list>

      <p-button
        type="submit"
        label="Sign In"
        [loading]="isLoading()"
        styleClass="w-full mt-2"
      />
    </form>

    <ng-template pTemplate="footer">
      <p class="text-center text-sm m-0">
        Don't have an account? <a routerLink="/signup" class="text-primary font-bold no-underline">Sign up</a>
      </p>
    </ng-template>
  </p-card>
</div>

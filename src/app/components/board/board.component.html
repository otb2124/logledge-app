@if (loading()) {
  <div class="flex justify-center items-center min-h-screen">
    <i class="pi pi-spin pi-spinner text-3xl text-surface-400"></i>
  </div>
} @else {
  @if (board(); as b) {
    <div class="p-6">
      <h1 class="text-2xl font-bold text-white mb-4">{{ b.name }}</h1>

      <div
        cdkDropListGroup
        class="flex gap-4 overflow-x-auto pb-4 items-start"
      >
        @for (list of b.lists; track list.id) {
          <div class="w-72 shrink-0 bg-surface-800 rounded-lg p-3 flex flex-col gap-2">

            <div class="flex justify-between items-center mb-1">
              <span class="font-semibold text-white">{{ list.name }}</span>
              <span class="text-surface-400 text-sm">{{ list.tickets.length }}</span>
            </div>

            <div
              cdkDropList
              [id]="'list-' + list.id"
              [cdkDropListData]="list.tickets"
              [cdkDropListConnectedTo]="listIds()"
              (cdkDropListDropped)="onTicketDrop($event, list)"
              class="flex flex-col gap-2 min-h-[8px]"
            >
              @for (ticket of list.tickets; track ticket.id) {
                <div
                  cdkDrag
                  [cdkDragData]="ticket"
                  [routerLink]="['/boards', b.id, 'tickets', ticket.id]"
                  [queryParams]="{ listId: list.id }"
                  class="bg-surface-700 hover:bg-surface-600 rounded-md p-3 cursor-pointer text-white text-sm"
                >
                  <div class="flex justify-between items-start gap-2">
                    <span>{{ ticket.title }}</span>
                    <span
                      class="text-xs px-2 py-0.5 rounded-full shrink-0"
                      [class.bg-red-500]="ticket.priority === 'High'"
                      [class.bg-yellow-500]="ticket.priority === 'Medium'"
                      [class.bg-green-500]="ticket.priority === 'Low'"
                    >
                      {{ ticket.priority }}
                    </span>
                  </div>
                </div>
              }
            </div>

            <app-add-ticket-inline [boardId]="b.id" [listId]="list.id" (added)="onTicketAdded(list, $event)" />

          </div>
        }

        <app-add-list-inline [boardId]="b.id" (added)="onListAdded($event)" />
      </div>
    </div>
  }
}

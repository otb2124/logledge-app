<div class="px-2 py-3">
  <p-menubar [model]="navItems" styleClass="border-none rounded-lg bg-surface-900 px-4 py-2">

    <ng-template pTemplate="start">
      <span class="text-lg font-bold text-white mr-6">LogLedge</span>
    </ng-template>

    <ng-template pTemplate="end">
      @if (authService.isAuthenticated()) {
        <div class="relative flex items-center">
          <button
            type="button"
            (click)="userMenu.toggle($event)"
            class="flex items-center gap-2 bg-transparent border-none cursor-pointer px-2 py-1 rounded-md hover:bg-surface-800"
          >
            <p-avatar [label]="initials()" shape="circle" styleClass="bg-primary text-sm"></p-avatar>
            <span class="text-white text-sm hidden sm:inline">
              {{ authService.currentUser()?.displayName }}
            </span>
            <i class="pi pi-chevron-down text-xs text-surface-400"></i>
          </button>
          <p-menu #userMenu [model]="userMenuItems()" [popup]="true" appendTo="body"></p-menu>
        </div>
      } @else {
        <a routerLink="/login">
          <p-button label="Login" size="small" />
        </a>
      }
    </ng-template>

  </p-menubar>
</div>
